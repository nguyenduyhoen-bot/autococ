name: Build & Package CAT Manager (Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version override (e.g. 1.1.4)'
        required: false
        default: '1.1.4'

jobs:
  build-macos:
    name: Build macOS DMG (ARM64 & x64 Universal)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Desktop App Dependencies
        run: |
          cd desktop-app
          npm ci || npm install

      - name: Extract Version
        id: get_version
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            VER=$(node -p "require('./desktop-app/package.json').version")
          fi
          echo "VERSION=${VER:-1.1.4}" >> $GITHUB_ENV
          echo "Determined Version: ${VER:-1.1.4}"

      - name: Build macOS DMG (CAT-Manager.dmg - ARM64 & Intel)
        run: |
          cd desktop-app
          npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Prepare Versioned Artifacts & Checksums
        run: |
          VER="${{ env.VERSION }}"
          mkdir -p release/macos
          DMG_FILES=$(find release -name "*.dmg" 2>/dev/null)
          echo "Found DMG files: $DMG_FILES"
          for f in $DMG_FILES; do
            filename=$(basename "$f")
            cp -f "$f" "release/macos/$filename"
            shasum -a 256 "$f" | awk '{print $1}' > "release/macos/$filename.sha256"
          done

          if [ -f "release/macos/CAT-Manager.dmg" ]; then
            cp -f "release/macos/CAT-Manager.dmg" "release/macos/CAT-Manager-${VER}.dmg"
            shasum -a 256 "release/macos/CAT-Manager-${VER}.dmg" | awk '{print $1}' > "release/macos/CAT-Manager-${VER}.dmg.sha256"
          fi

          echo "macOS Artifacts prepared in release/macos/:"
          ls -la release/macos/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CAT-Manager-macOS-DMG
          path: |
            release/macos/*.dmg
            release/macos/*.dmg.sha256
          if-no-files-found: error
