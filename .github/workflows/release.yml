name: Automated Release & Direct GitHub Differential Patch

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Target Version to release (e.g. 1.1.4)'
        required: false
        default: '1.1.4'
      from_version:
        description: 'Source Version for differential patch (e.g. 1.1.1)'
        required: false
        default: '1.1.1'

permissions:
  contents: write

jobs:
  release-and-patch:
    name: Build, Sign & Publish to autococ-updates
    runs-on: ubuntu-latest

    steps:
      # Step 1: Kiểm tra Source
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Chạy Tests
      - name: 2. Run Tests & Environment Verification
        run: |
          echo "=================================================="
          echo "🔍 Step 1 & 2: Checking Source & Verifying Environment..."
          echo "=================================================="
          git status
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "Current Commit: $COMMIT_HASH"
          echo "Source Repo: ${{ github.repository }}"
          echo "Target Update Repo: nguyenduyhoen-bot/autococ-updates"

      # Setup Node.js 20
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Build Production
      - name: 3. Build Production
        run: |
          echo "=================================================="
          echo "🔨 Step 3: Building Production Desktop Package..."
          echo "=================================================="
          cd desktop-app
          npm ci || npm install
          npm run build
          cd ..
          echo "Production build completed successfully."

      # Step 4: Tạo Protected Patch & Steps 5-7 (Manifest, SHA256, Ed25519)
      - name: 4-7. Generate Protected Differential Patch, Manifest, SHA256 & Ed25519 Signature
        id: patch_gen
        env:
          ED25519_PRIVATE_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
        run: |
          echo "=================================================="
          echo "📦 Steps 4-7: Generating Signed Multi-Platform Patches..."
          echo "=================================================="
          TARGET_VER="${{ github.event.inputs.version }}"
          if [ -z "$TARGET_VER" ]; then
            TAG_NAME="${{ github.ref_name }}"
            TARGET_VER="${TAG_NAME#v}"
          fi
          if [ -z "$TARGET_VER" ] || [ "$TARGET_VER" = "main" ]; then
            TARGET_VER=$(node -p "require('./desktop-app/package.json').version")
          fi

          FROM_VER="${{ github.event.inputs.from_version }}"
          if [ -z "$FROM_VER" ]; then
            FROM_VER="1.1.1"
          fi

          echo "FROM_VERSION=$FROM_VER" >> $GITHUB_ENV
          echo "TO_VERSION=$TARGET_VER" >> $GITHUB_ENV
          echo "RELEASE_TAG=v$TARGET_VER" >> $GITHUB_ENV

          mkdir -p config
          echo "$ED25519_PRIVATE_KEY" > config/ed25519_private.pem
          chmod 600 config/ed25519_private.pem

          node scripts/generate_patch.js --from "$FROM_VER" --to "$TARGET_VER"

      # Step 8: Kiểm tra Package (Strict Pre-Publish Audit: NO .exe, .dmg, .msi, .pkg)
      - name: 8. Strict Pre-Publish Security Audit
        run: |
          echo "=================================================="
          echo "🛡️ Step 8: Auditing Assets Against Forbidden Installers..."
          echo "=================================================="
          FORBIDDEN=$(find release/patches -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.msi" -o -name "*.pkg" \))
          if [ -n "$FORBIDDEN" ]; then
            echo "❌ CRITICAL SECURITY VIOLATION: Forbidden installer detected: $FORBIDDEN"
            echo "Aborting release immediately."
            exit 1
          fi
          echo "✅ Audit passed: Zero installer binaries detected."

          # Verify mandatory assets
          test -f "release/patches/patch-manifest.json" || (echo "Missing patch-manifest.json" && exit 1)
          test -f "release/patches/SHA256SUMS.txt" || (echo "Missing SHA256SUMS.txt" && exit 1)
          test -f "release/patches/patch-signature.sig" || (echo "Missing patch-signature.sig" && exit 1)
          test -f "release/patches/RELEASE_NOTES.md" || (echo "Missing RELEASE_NOTES.md" && exit 1)

          PATCH_COUNT=$(find release/patches -name "CAT-Patch-*.zip" | wc -l)
          if [ "$PATCH_COUNT" -eq 0 ]; then
            echo "❌ No patch zip files found!"
            exit 1
          fi
          echo "✅ Verified $PATCH_COUNT patch archives and all security artifacts."

      # Steps 9-13: Push Patch, Tạo Tag, Tạo Release, Upload Assets & Publish trên autococ
      - name: 9-13. Publish Release Directly to Repository (autococ)
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "=================================================="
          echo "🚀 Steps 9-13: Publishing to ${{ github.repository }}..."
          echo "=================================================="
          
          # Delete existing release or tag if re-releasing the same version
          gh release delete "${{ env.RELEASE_TAG }}" --repo ${{ github.repository }} --yes --cleanup-tag > /dev/null 2>&1 || true

          # Create release and upload all patch assets
          gh release create "${{ env.RELEASE_TAG }}" \
            release/patches/CAT-Patch-*.zip \
            release/patches/patch-manifest.json \
            release/patches/SHA256SUMS.txt \
            release/patches/patch-signature.sig \
            --repo ${{ github.repository }} \
            --title "CAT Manager ${{ env.RELEASE_TAG }} Secure Patch Release" \
            --notes-file release/patches/RELEASE_NOTES.md

          echo "✅ Release ${{ env.RELEASE_TAG }} published successfully to ${{ github.repository }}!"

      # Step 14-15: Kiểm tra Release sau khi Publish bằng GitHub API
      - name: 14-15. Verify Release via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "=================================================="
          echo "🔍 Step 14-15: Verifying Published Release via GitHub API..."
          echo "=================================================="
          REL_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ env.RELEASE_TAG }}")
          TAG_NAME=$(echo "$REL_JSON" | grep -o '"tag_name": *"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "Verified Published Tag on ${{ github.repository }}: $TAG_NAME"
          if [ "$TAG_NAME" != "${{ env.RELEASE_TAG }}" ]; then
            echo "❌ Expected tag ${{ env.RELEASE_TAG }}, but got $TAG_NAME"
            exit 1
          fi
          ASSET_COUNT=$(echo "$REL_JSON" | grep -o '"name": *"CAT-Patch' | wc -l)
          echo "Found $ASSET_COUNT patch assets verified in release payload."
          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "❌ No patch assets verified in published release!"
            exit 1
          fi
          echo "🎉 Verification PASSED: Release ${{ env.RELEASE_TAG }} is LIVE on https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}"
